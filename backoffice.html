<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./assets/dist/css/style.min.css" />

    <title>Gestione Prodotto</title>
  </head>

  <body>
    <!-- Navbar con link e bottone -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><i class="bi bi-water"></i>Makani Surf</a>
        <a href="index.html" class="btn btn-rosa ms-auto">Torna alla home</a>
      </div>
    </nav>

    <div class="container py-4">
      <h1 class="text-center mb-4">Gestione Prodotto</h1>

      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <form id="product-form">
            <div class="mb-3">
              <label for="name" class="form-label">Nome</label>
              <input type="text" class="form-control" id="name" required />
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Descrizione</label>
              <textarea class="form-control" id="description" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label for="brand" class="form-label">Brand</label>
              <input type="text" class="form-control" id="brand" required />
            </div>
            <div class="mb-3">
              <label for="imageUrl" class="form-label">URL Immagine</label>
              <input type="url" class="form-control" id="imageUrl" required />
            </div>
            <div class="mb-3">
              <label for="price" class="form-label">Prezzo</label>
              <input type="number" class="form-control" id="price" min="0" step="0.01" required />
            </div>

            <div id="alert-container"></div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-rosa flex-fill">Salva</button>
              <button type="button" class="btn btn-rosa flex-fill" id="reset-btn">Reset</button>
              <button type="button" class="btn btn-rosa flex-fill" id="delete-btn">Elimina</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
      crossorigin="anonymous"
    ></script>
    <script src="./backoffice.js"></script>
  </body>
</html>
